<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати клієнта</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
        form { background: white; padding: 20px; border-radius: 8px; width: 300px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        a { display: block; margin-top: 10px; text-align: center; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <h2>Додати нового клієнта</h2>
    <form method="POST">
        <label>Ім'я:</label>
        <input type="text" name="first_name" required>
        
        <label>Прізвище:</label>
        <input type="text" name="last_name" required>
        
        <label>Телефон:</label>
        <input type="text" name="phone" required>
        
        <label>Email:</label>
        <input type="email" name="email">
        
        <button type="submit">Зберегти</button>
    </form>
    <a href="/">Назад до списку</a>
</body>
</html>
